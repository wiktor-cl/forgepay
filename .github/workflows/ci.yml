name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forgepay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy libs services
      - run: python -m compileall libs services tests
      - run: docker compose down -v
      - run: docker compose up -d postgres redis kafka
      - run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U forgepay -d forgepay && exit 0
            sleep 1
          done
          exit 1
      - run: alembic upgrade head
        env:
          FORGEPAY_DATABASE_URL: postgresql+asyncpg://forgepay:forgepay@localhost:5432/forgepay
      - run: docker compose up -d --build
      - run: pytest
      - run: pip-audit

  resilience:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: docker compose down -v
      - run: docker compose up -d postgres redis kafka
      - run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U forgepay -d forgepay && exit 0
            sleep 1
          done
          exit 1
      - run: alembic upgrade head
        env:
          FORGEPAY_DATABASE_URL: postgresql+asyncpg://forgepay:forgepay@localhost:5432/forgepay
      - run: docker compose up -d --build
      - run: pytest tests/resilience -q
