apiVersion: v1
kind: ConfigMap
metadata:
  name: forgepay-payment-config
data:
  FORGEPAY_KAFKA_TOPIC_EVENTS: forgepay.events
---
apiVersion: v1
kind: Secret
metadata:
  name: forgepay-payment-secret-example
type: Opaque
stringData:
  FORGEPAY_DATABASE_URL: replace-me
  FORGEPAY_WEBHOOK_SECRET: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgepay-payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgepay-payment-service
  template:
    metadata:
      labels:
        app: forgepay-payment-service
    spec:
      containers:
        - name: payment-service
          image: forgepay/payment-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: forgepay-payment-config
            - secretRef:
                name: forgepay-payment-secret-example
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forgepay-payment-service
spec:
  selector:
    app: forgepay-payment-service
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forgepay-payment-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: forgepay-payment-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgepay-payment-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgepay-payment-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
